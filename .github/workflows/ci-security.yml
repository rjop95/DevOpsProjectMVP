# Nombre que aparecerá en la interfaz de GitHub Actions para identificar este flujo de trabajo
name: CI Security and Build Pipeline

# Define en qué momentos o eventos se disparará automáticamente este pipeline
on:
  push:
    branches: [ "main" ] # Se ejecuta cada vez que haces un 'push' o subes cambios a la rama principal 'main'
  pull_request:
    branches: [ "main" ] # Se ejecuta también cuando abres o actualizas un Pull Request hacia la rama 'main'

# Configuración de permisos de seguridad por defecto para el token de GitHub Actions
permissions:
  contents: read # Solo le da permisos de lectura al repositorio (principio de privilegios mínimos)

# Definición de los trabajos (jobs) que correrán en este pipeline
jobs:
  security-and-build:
    runs-on: ubuntu-latest # Define el sistema operativo del servidor virtual (runner) donde correrá el pipeline
    steps:
      # Paso 1: Descargar el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4 # Acción oficial de GitHub para clonar tu repositorio en el servidor virtual

      # Paso 2: Preparar el entorno de lenguaje
      - name: Configurar Python
        uses: actions/setup-python@v5 # Acción oficial para instalar Python en el servidor
        with:
          python-version: '3.11' # Versión específica de Python que usará el pipeline
          cache: 'pip' # Guarda en caché las librerías para que las siguientes ejecuciones sean más rápidas

      # Paso 3: Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip # Actualiza el gestor de paquetes pip a su última versión
          pip install -r requirements.txt # Instala todas las librerías declaradas en tu archivo requirements.txt

      # Paso 4: Análisis estático de seguridad en el código (SAST)
      - name: Análisis estático de seguridad (Bandit)
        run: |
          bandit -r app/ -ll # Analiza recursivamente la carpeta 'app/' buscando fallos de seguridad en el código Python (-ll filtra solo alertas de severidad media y alta)

      # Paso 5: Escaneo de vulnerabilidades conocidas en las dependencias
      - name: Revisar vulnerabilidades en dependencias (Safety)
        run: |
          safety check --full-report # Revisa si las versiones de las librerías instaladas tienen alguna vulnerabilidad reportada (CVE)

      # Paso 6: Verificación de empaquetado (Contenerización)
      - name: Construir imagen Docker de prueba
        run: |
          docker build -t devops-project-mvp:${{ github.sha }} . # Construye la imagen Docker localmente usando el Dockerfile de la raíz y le etiqueta un identificador único basado en el commit actual (${{ github.sha }})